name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version in x.y.z format, for example: 1.0.0. Do not include v. Must match VERSION."
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease for testing."
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-windows:
    name: Build Windows x64
    # CMakePresets.json requires Visual Studio 2022; keep the runner aligned.
    runs-on: windows-2022
    env:
      VERSION: ${{ inputs.version }}
      OPENVR_VERSION: 2.15.6
      OPENVR_COMMIT: 0924064316de3effbcd1acf1e309182a2deb1c05

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.40.0"

      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version '$env:VERSION'. Use a value like 1.0.0 without v."
          }

          $projectVersion = (just show-version).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the project version with just show-version."
          }
          if ($projectVersion -ne $env:VERSION) {
            throw "Release version '$env:VERSION' does not match VERSION '$projectVersion'."
          }

      - name: Restore pinned OpenVR SDK
        shell: pwsh
        run: |
          git clone --depth 1 --branch "v$($env:OPENVR_VERSION)" https://github.com/ValveSoftware/openvr.git openvr
          if ($LASTEXITCODE -ne 0) {
            throw "Could not clone OpenVR SDK v$($env:OPENVR_VERSION)."
          }

          $actualCommit = (git -C openvr rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Could not resolve the checked-out OpenVR commit."
          }
          if ($actualCommit -ne $env:OPENVR_COMMIT) {
            throw "OpenVR v$($env:OPENVR_VERSION) resolved to '$actualCommit', expected '$env:OPENVR_COMMIT'."
          }

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $innoVersion = (Get-Content -LiteralPath installer/INNO_SETUP_VERSION -Raw).Trim()
          $expectedHash = (Get-Content -LiteralPath installer/INNO_SETUP_SHA256 -Raw).Trim().ToLowerInvariant()
          if ($innoVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid pinned Inno Setup version '$innoVersion'."
          }
          if ($expectedHash -notmatch '^[0-9a-f]{64}$') {
            throw "Invalid pinned Inno Setup SHA-256 '$expectedHash'."
          }

          $tagVersion = $innoVersion.Replace('.', '_')
          $installerUrl = "https://github.com/jrsoftware/issrc/releases/download/is-$tagVersion/innosetup-$innoVersion-x64.exe"
          $installerPath = Join-Path $env:RUNNER_TEMP "innosetup-$innoVersion-x64.exe"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath

          $actualHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Inno Setup installer SHA-256 '$actualHash' does not match '$expectedHash'."
          }

          $process = Start-Process -FilePath $installerPath -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER'
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed: $($process.ExitCode)"
          }

      - name: Build Windows installer
        shell: pwsh
        run: just build-installer

      - name: Attest Windows installer
        uses: actions/attest@v4
        with:
          subject-path: out/installer/steamvr-gesture-exit-v${{ env.VERSION }}-windows-x64-setup.exe

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: steamvr-gesture-exit-v${{ env.VERSION }}-windows-x64
          path: out/installer/steamvr-gesture-exit-v${{ env.VERSION }}-windows-x64-setup.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows
    env:
      VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download release asset
        uses: actions/download-artifact@v4
        with:
          name: steamvr-gesture-exit-v${{ env.VERSION }}-windows-x64
          path: release-assets

      - name: Create release
        shell: bash
        run: |
          release_flags=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "v${VERSION}" \
            "${release_flags[@]}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes "" \
            "release-assets/steamvr-gesture-exit-v${VERSION}-windows-x64-setup.exe"

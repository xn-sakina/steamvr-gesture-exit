name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version in x.y.z format, for example: 1.0.0. Do not include v. Must match VERSION."
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease for testing."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      OPENVR_VERSION: 2.15.6
      OPENVR_COMMIT: 0924064316de3effbcd1acf1e309182a2deb1c05

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.40.0"

      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version '$env:VERSION'. Use a value like 1.0.0 without v."
          }

          $projectVersion = (just show-version).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the project version with just show-version."
          }
          if ($projectVersion -ne $env:VERSION) {
            throw "Release version '$env:VERSION' does not match VERSION '$projectVersion'."
          }

      - name: Restore pinned OpenVR SDK
        shell: pwsh
        run: |
          git clone --depth 1 --branch "v$($env:OPENVR_VERSION)" https://github.com/ValveSoftware/openvr.git openvr
          if ($LASTEXITCODE -ne 0) {
            throw "Could not clone OpenVR SDK v$($env:OPENVR_VERSION)."
          }

          $actualCommit = (git -C openvr rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Could not resolve the checked-out OpenVR commit."
          }
          if ($actualCommit -ne $env:OPENVR_COMMIT) {
            throw "OpenVR v$($env:OPENVR_VERSION) resolved to '$actualCommit', expected '$env:OPENVR_COMMIT'."
          }

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 --exact --silent `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed: $LASTEXITCODE"
          }

      - name: Import Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_PASSWORD)) {
            throw "WINDOWS_CODESIGN_PFX_BASE64 and WINDOWS_CODESIGN_PFX_PASSWORD secrets are required."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "steamvr-gesture-exit-codesign.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64)
            )
            $password = ConvertTo-SecureString $env:WINDOWS_CODESIGN_PFX_PASSWORD -AsPlainText -Force
            $imported = @(Import-PfxCertificate -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My -Password $password)
            $certificate = $imported | Where-Object {
              $_.HasPrivateKey -and @($_.EnhancedKeyUsageList | Where-Object {
                $_.ObjectId.Value -eq "1.3.6.1.5.5.7.3.3"
              }).Count -gt 0
            } | Select-Object -First 1
            if (-not $certificate) {
              throw "The PFX did not contain a code-signing certificate with a private key."
            }
            "WINDOWS_CODESIGN_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Build and verify signed Windows installer
        shell: pwsh
        run: |
          & installer/build.ps1 -RequireSigning `
            -CertificateThumbprint $env:WINDOWS_CODESIGN_CERTIFICATE_THUMBPRINT

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: steamvr-gesture-exit-v${{ env.VERSION }}-windows-x64
          path: out/installer/steamvr-gesture-exit-v${{ env.VERSION }}-windows-x64-setup.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows
    env:
      VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download release asset
        uses: actions/download-artifact@v4
        with:
          name: steamvr-gesture-exit-v${{ env.VERSION }}-windows-x64
          path: release-assets

      - name: Create release
        shell: bash
        run: |
          release_flags=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "v${VERSION}" \
            "${release_flags[@]}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes "" \
            "release-assets/steamvr-gesture-exit-v${VERSION}-windows-x64-setup.exe"

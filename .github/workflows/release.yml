name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Restore pinned OpenVR SDK
        shell: pwsh
        run: |
          git clone https://github.com/ValveSoftware/openvr.git openvr
          git -C openvr checkout 00ca7e594e9e8b1d9384bdc52eacb05120b17367

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version."
          }

      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup.7 -e --silent `
            --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed: $LASTEXITCODE" }

      - name: Build and test installer payload
        shell: pwsh
        run: .\installer\build.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: steamvr-gesture-exit-windows-x64
          path: out/installer/SteamVR-Gesture-Exit-*-windows-x64-setup.exe
          if-no-files-found: error

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/installer/SteamVR-Gesture-Exit-*-windows-x64-setup.exe
          generate_release_notes: true
